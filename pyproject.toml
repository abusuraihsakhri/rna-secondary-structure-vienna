[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-secondary-structure-vienna"
version = "2.0.0"
description = "RNAShape-Predictor: Minimum Free Energy (MFE) Secondary Structure & Dot-Bracket Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
vienna = ["ViennaRNA>=2.6,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "rna_shape_predictor_app"]

[tool.setuptools.packages.find]
include = ["agents*", "rna_shape_predictor*"]

[project.scripts]
rna-secondary-structure-vienna = "rna_shape_predictor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/rna-secondary-structure-vienna"
Repository = "https://github.com/abusuraihsakhri/rna-secondary-structure-vienna.git"
