[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-secondary-structure-vienna"
version = "2.0.0"
description = "RNAShape-Predictor: Minimum Free Energy (MFE) Secondary Structure & Dot-Bracket Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rna-secondary-structure-vienna = "rna_shape_predictor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/rna-secondary-structure-vienna"
Repository = "https://github.com/abusuraihsakhri/rna-secondary-structure-vienna.git"
