name: Tests and validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,vienna,test]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents rna_shape_predictor cli.py enrichment.py simulator.py
      - name: Run Python suite
        run: python -m pytest -q
      - name: Run browser algorithm tests
        run: node --test tests/test_web.cjs
      - name: CLI smoke tests
        run: |
          python cli.py verify-audit
          python cli.py fold --sequence GGGAAACCC --json
          python -m rna_shape_predictor.cli fold --sequence GGGAAACCC
